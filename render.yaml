# Render Blueprint (IaC) for Careme Clinic OS
# Split mandated by to_deploy.md §1: Vercel serves the React SPA; Render runs
# the long-lived Express API + 2 worker processes + Redis + Postgres.
# Apply via Render dashboard → New → Blueprint → connect this repo.
#
# NOTE: Prisma 7 requires a driver adapter. URLs live in prisma.config.ts,
# not schema.prisma. Build passes `provider = "postgresql"`.
#
# ── RLS ROLE MODEL ───────────────────────────────────────────────────────
# RLS is LIVE. Three Postgres roles are in play:
#   careme_app    — NOSUPERUSER NOBYPASSRLS (app runtime — RLS enforced)
#   careme_bypass — BYPASSRLS (workers — reads tenant rows without GUCs)
#   postgres      — superuser (migrations/DDL only, via SUPERUSER_URL)
#
# DATABASE_URL + DIRECT_URL MUST point to careme_app (port 5432, session mode).
# Transaction-mode pooler (6543) drops SET LOCAL state and breaks RLS.
# SUPERUSER_URL is used by prisma.config.ts for `prisma migrate deploy`.

services:
  # ── Web API (long-lived) ───────────────────────────────────────────────
  - type: web
    name: careme-web
    runtime: node
    plan: starter
    branch: main
    rootDir: .
    buildCommand: npm install --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false            # careme_app @ session-mode pooler (:5432)
      - key: DIRECT_URL
        sync: false            # careme_app @ session-mode pooler (:5432)
      - key: SUPERUSER_URL
        sync: false            # postgres superuser — for prisma migrate deploy
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false            # exactly 32 hex chars
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://careme-snowy.vercel.app
      - key: REDIS_URL
        fromService:
          name: careme-redis
          type: redis
          property: connectionString
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: "7"
      - key: TOTP_ISSUER
        value: Careme
      - key: LOGIN_RATE_LIMIT
        value: "5"
      - key: LOGIN_RATE_WINDOW
        value: "300"
      - key: API_RATE_LIMIT
        value: "100"
      - key: API_RATE_WINDOW
        value: "60"

  # ── BullMQ worker (reminder dispatch) ──────────────────────────────────
  - type: worker
    name: careme-worker
    runtime: node
    plan: starter
    branch: main
    rootDir: .
    buildCommand: npm install --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: npm run worker   # tsx src/jobs/worker.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false            # careme_bypass role (BYPASSRLS) for workers
      - key: DIRECT_URL
        sync: false            # careme_bypass role
      - key: REDIS_URL
        fromService:
          name: careme-redis
          type: redis
          property: connectionString

  # ── Reminder sweep (fallback dispatch) ─────────────────────────────────
  - type: worker
    name: careme-sweep
    runtime: node
    plan: starter
    branch: main
    rootDir: .
    buildCommand: npm install --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: npm run worker:sweep   # tsx src/notifications/reminder-processor.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false            # careme_bypass role (BYPASSRLS) for workers
      - key: DIRECT_URL
        sync: false            # careme_bypass role
      - key: REDIS_URL
        fromService:
          name: careme-redis
          type: redis
          property: connectionString

  # ── Redis (BullMQ + rate limiting) ─────────────────────────────────────
  - type: redis
    name: careme-redis
    plan: starter
    ipAllowList: []
